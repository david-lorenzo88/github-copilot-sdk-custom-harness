<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Claw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/neon.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" data-text="FINANCE//CLAW">FINANCE//CLAW</span>
      <small data-i18n="brand.sub">GitHub Copilot SDK para .NET</small>
    </div>
    <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>
    <div class="hud">
      <div class="hud-item">
        <span class="hud-label" data-i18n="hud.engine">Motor</span>
        <span class="hud-value" id="engine">GitHub Copilot</span>
      </div>
      <div class="hud-item">
        <span class="hud-label" data-i18n="hud.model">Modelo</span>
        <span class="hud-value" id="model">—</span>
      </div>
      <div class="hud-item gauge-wrap">
        <span class="hud-label"><span data-i18n="hud.context">Contexto</span> <b id="gauge-text"></b></span>
        <div class="gauge" id="gauge"><span id="gauge-fill"></span></div>
      </div>
      <div class="lang-switch" role="group" data-i18n-aria="lang.label" aria-label="Idioma">
        <button type="button" data-lang="es" lang="es" title="Español">ES</button>
        <button type="button" data-lang="en" lang="en" title="English">EN</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <nav class="rail" data-i18n-aria="aria.rail" aria-label="Pasos de la demo">
      <div class="rail-line"><span id="rail-progress"></span></div>
      <ol id="rail"></ol>
    </nav>

    <section class="chat" data-i18n-aria="aria.chat" aria-label="Conversación con el agente">
      <div class="chat-head">
        <span class="chat-step" id="chat-step"></span>
        <h1 id="chat-title"></h1>
        <span class="session-pill" id="session"></span>
      </div>
      <div class="feed" id="feed" aria-live="polite"></div>
      <div class="prompts" id="prompts"></div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" data-i18n-placeholder="composer.placeholder" data-i18n-aria="aria.input" placeholder="Pregunta a Finance Claw…" aria-label="Mensaje para el agente"></textarea>
        <button type="submit" class="btn-send" id="send" data-i18n="composer.send">Enviar</button>
        <button type="button" class="btn-stop" id="stop" data-i18n="composer.stop" hidden>Parar</button>
      </form>
    </section>

    <aside class="context" data-i18n-aria="aria.context" aria-label="Información de contexto">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="concept" class="active" data-i18n="tab.concept">Concepto</button>
        <button role="tab" data-tab="code" data-i18n="tab.code">Código</button>
        <button role="tab" data-tab="portfolio" data-i18n="tab.portfolio">Cartera</button>
        <button role="tab" data-tab="activity"><span data-i18n="tab.activity">Actividad</span><span class="tab-badge" id="activity-badge" hidden>0</span></button>
      </div>
      <div class="panel active" data-panel="concept" id="panel-concept"></div>
      <div class="panel" data-panel="code" id="panel-code"></div>
      <div class="panel" data-panel="portfolio" id="panel-portfolio"></div>
      <div class="panel" data-panel="activity">
        <p class="panel-intro" data-i18n-html="activity.intro">Cada decisión de los hooks y cada herramienta ejecutada, en directo. Es lo mismo que se guarda en <code>workspace/audit.log</code>.</p>
        <ul class="activity" id="activity"></ul>
      </div>
    </aside>
  </main>

  <dialog id="approval" aria-labelledby="approval-question">
    <div class="approval-card">
      <div class="approval-head">
        <span class="approval-kind" id="approval-kind"></span>
        <span class="approval-source">OnPermissionRequest</span>
      </div>
      <h2 id="approval-question"></h2>
      <div id="approval-detail"></div>
      <div class="approval-timer"><span id="approval-timer"></span></div>
      <div class="approval-actions">
        <button type="button" class="btn-reject" id="approval-reject" data-i18n-html="approval.reject">Rechazar <kbd>N</kbd></button>
        <button type="button" class="btn-approve" id="approval-approve" data-i18n-html="approval.approve">Aprobar <kbd>S</kbd></button>
      </div>
    </div>
  </dialog>

  <script src="js/i18n.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
